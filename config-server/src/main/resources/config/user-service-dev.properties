

spring.datasource.url=jdbc:mysql://localhost:3306/Customer_Record?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Admin@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


#Eureka server Connection
#Tells the client to register with the Eureka server
eureka.client.service-url.defaultZone=http://localhost:8084/eureka/

#should this service register itself with Eureka server? Yes
eureka.client.register-with-eureka=true


#should this service fetch registry to discover other services? Yes
eureka.client.fetch-registry=true

management.endpoints.web.exposure.include=*
tracing.sampler.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

resilience4j.circuitbreaker.instances.account-service.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.account-service.slidingWindowSize=10
resilience4j.circuitbreaker.instances.account-service.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.account-service.failureRateThreshold=50
resilience4j.circuitbreaker.instances.account-service.waitDurationInOpenState=20s
resilience4j.circuitbreaker.instances.account-service.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.account-service.automaticTransitionFromOpenToHalfOpenEnabled=true

