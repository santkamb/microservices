server.port=8084

#should this server register with another Eureka server? No, it is the Eureka server to form cluster?
#since this standalone server we set this false.
eureka.client.register-with-eureka=false

#should this server fetch registry information from another Eureka server?
#Agaain since its the only server it doesn't need to fetch registery.
eureka.client.fetch-registry=false

management.endpoints.web.exposure.include=*
tracing.sampler.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
