server.port=8082
#Eureka server Connection
#Tells the client to register with the Eureka server
eureka.client.service-url.defaultZone=http://localhost:8084/eureka/

#should this service register itself with Eureka server? Yes
eureka.client.register-with-eureka=true


#should this service fetch registry to discover other services? Yes
eureka.client.fetch-registry=true

spring.cloud.gateway.server.webmvc.routes[0].id=user-service
spring.cloud.gateway.server.webmvc.routes[0].uri=http://localhost:8289/
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/v1/customers/**

logging.org.springframework.cloud.gateway.route.RouteDefinitionRouteLocator=DEBUG
logging.org.springframework.cloud.gateway=TRACE

management.endpoints.web.exposure.include=*
tracing.sampler.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

