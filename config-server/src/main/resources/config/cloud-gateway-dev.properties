server.port=8082
#Eureka server Connection
#Tells the client to register with the Eureka server
eureka.client.service-url.defaultZone=http://localhost:8084/eureka/
logging.level.reactor.netty=DEBUG
#should this service register itself with Eureka server? Yes
eureka.client.register-with-eureka=true


#should this service fetch registry to discover other services? Yes
eureka.client.fetch-registry=true


spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=http://localhost:8289
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/customers/**

spring.cloud.gateway.routes[1].id=auth-service
spring.cloud.gateway.routes[1].uri=http://localhost:8288
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.routes[2].id=account-service
spring.cloud.gateway.routes[2].uri=http://localhost:8290
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/accounts/**

logging.org.springframework.cloud.gateway.route.RouteDefinitionRouteLocator=DEBUG
logging.org.springframework.cloud.gateway=TRACE

management.endpoints.web.exposure.include=*
tracing.sampler.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

