spring.application.name=user-service
spring.profiles.active=dev
logging.level.root=INFO
spring.config.import=configserver:http://localhost:8083
logging.level.org.springframework.cloud.config=DEBUG
logging.level.org.springframework.boot.context.config=DEBUG

server.port = 8085

spring.datasource.url=jdbc:mysql://localhost:3306/userrecord?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Admin@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect



#Eureka server Connection
#Tells the client to register with the Eureka server
eureka.client.service-url.defaultZone=http://localhost:8084/eureka/

#should this service register itself with Eureka server? Yes
eureka.client.register-with-eureka=true


#should this service fetch registry to discover other services? Yes
eureka.client.fetch-registry=true
